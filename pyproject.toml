[project]
name = "qr-mcp"
version = "0.1.0"
description = "Servidor MCP: genera un código QR con estilo a partir de un link. Sin base de datos, sin secretos, sin autenticación."
requires-python = ">=3.10"
dependencies = [
    "fastmcp[apps]==4.0.5",
    "qrcode[pil]>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qrmcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
